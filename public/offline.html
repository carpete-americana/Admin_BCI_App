<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | BCI Admin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', 'Segoe UI', -apple-system, sans-serif;
      background: #0f0f14;
      color: #f1f1f4;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 30% 20%, rgba(99, 102, 241, 0.08) 0%, transparent 60%),
                  radial-gradient(ellipse at 70% 80%, rgba(99, 102, 241, 0.05) 0%, transparent 60%);
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 40px;
      max-width: 400px;
      width: 100%;
    }

    .icon-wrapper {
      width: 72px;
      height: 72px;
      border-radius: 16px;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }

    .icon-wrapper i {
      font-size: 28px;
      color: #ef4444;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    p {
      font-size: 14px;
      color: #9898a6;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .actions {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .btn-primary {
      background: #6366f1;
      color: #fff;
    }

    .btn-primary:hover {
      background: #4f46e5;
    }

    .btn-secondary {
      background: #252532;
      color: #9898a6;
      border: 1px solid #2d2d3d;
    }

    .btn-secondary:hover {
      background: #2d2d3d;
      color: #f1f1f4;
    }

    .tip {
      margin-top: 24px;
      font-size: 12px;
      color: #6b6b7a;
    }

    .tip i { margin-right: 4px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon-wrapper">
      <i class="fas fa-wifi-slash"></i>
    </div>
    <h1>Sem ligação à internet</h1>
    <p>Liga-te à internet para continuares a usar o BCI Admin. O conteúdo será carregado automaticamente quando a ligação for restabelecida.</p>
    <div class="actions">
      <button id="retryBtn" class="btn btn-primary">
        <i class="fas fa-redo-alt"></i> Tentar novamente
      </button>
      <button id="quitBtn" class="btn btn-secondary">
        <i class="fas fa-times"></i> Fechar
      </button>
    </div>
    <div class="tip">
      <i class="fas fa-lightbulb"></i> Verifica o Wi-Fi ou a ligação de rede.
    </div>
  </div>

  <script>
    (function() {
      const retry = document.getElementById('retryBtn');
      const quit = document.getElementById('quitBtn');

      if (retry) retry.addEventListener('click', () => {
        if (!navigator.onLine) return;
        try {
          if (window.electronAPI && typeof window.electronAPI.navigate === 'function') {
            window.electronAPI.navigate('index.html');
          } else {
            window.location.replace('index.html');
          }
        } catch (e) {
          window.location.replace('index.html');
        }
      });

      if (quit) quit.addEventListener('click', () => {
        window.close();
      });

      window.addEventListener('online', () => {
        try {
          if (window.electronAPI && typeof window.electronAPI.navigate === 'function') {
            window.electronAPI.navigate('index.html');
          } else {
            window.location.replace('index.html');
          }
        } catch (e) {
          window.location.replace('index.html');
        }
      });
    })();
  </script>
</body>
</html>
