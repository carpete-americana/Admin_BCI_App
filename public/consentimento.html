<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BCI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Segoe UI", system-ui, sans-serif; }
    html, body { height: 100%; }
    body { display: flex; flex-direction: column; background: #F8FAFC; color: #1E293B; padding: 28px 28px 22px; }
    .marca { width: 44px; height: 44px; border-radius: 12px; background: #6366F1; margin-bottom: 16px; }
    h1 { font-size: 20px; font-weight: 700; margin-bottom: 14px; }
    #texto { flex: 1; overflow-y: auto; font-size: 14px; line-height: 1.5; color: #334155; }
    #texto p { margin-bottom: 10px; }
    #texto p.item { padding-left: 4px; }
    .botoes { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
    button { font-size: 14px; font-weight: 600; padding: 10px 20px; border-radius: 10px; border: 1px solid #CBD5E1; background: #FFFFFF; color: #334155; cursor: pointer; }
    button:hover { background: #F1F5F9; }
    button.principal { background: #6366F1; border-color: #6366F1; color: #FFFFFF; }
    button.principal:hover { background: #4F46E5; }
    button:focus-visible { outline: 3px solid #A5B4FC; outline-offset: 2px; }
  </style>
</head>
<body>
  <div class="marca"></div>
  <h1 id="titulo"></h1>
  <div id="texto"></div>
  <div class="botoes">
    <button id="recusar" type="button"></button>
    <button id="aceitar" type="button" class="principal"></button>
  </div>
</body>
</html>
