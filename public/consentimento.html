<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; font-src 'self' file:">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BCI</title>
  <style>
    @font-face { font-family: "Inter"; src: url("vendor/inter-5.3.0/inter-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      display: flex; flex-direction: column; overflow: hidden; user-select: none;
      font-family: "Inter", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased;
      background: #F8FAFC; color: #0F172A; border: 1px solid #E2E8F0;
    }

    /* Sem moldura: a janela arrasta-se pelo cabeçalho. */
    .topo {
      position: relative; padding: 28px 30px 22px; -webkit-app-region: drag;
      background:
        radial-gradient(circle at 92% -10%, rgba(99, 102, 241, 0.22) 0, rgba(99, 102, 241, 0) 55%),
        linear-gradient(180deg, #EEF2FF 0%, #F8FAFC 100%);
    }
    .marca { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
    .logo { width: 44px; height: 44px; flex: none; filter: drop-shadow(0 4px 10px rgba(15, 23, 42, 0.16)); }
    .etiqueta {
      display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px;
      background: rgba(99, 102, 241, 0.1); color: #4F46E5; font-size: 11.5px; font-weight: 600; letter-spacing: 0.02em;
    }
    .etiqueta::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #6366F1; }
    h1 { font-size: 21px; font-weight: 700; line-height: 1.25; letter-spacing: -0.015em; }

    #texto { flex: 1; overflow-y: auto; padding: 4px 30px 18px; font-size: 13.5px; line-height: 1.55; color: #475569; }
    #texto > p:first-child { color: #334155; font-size: 14px; }
    #texto p + ul, #texto ul + p { margin-top: 14px; }
    ul { list-style: none; background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 14px; padding: 2px 16px; box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04); }
    li { position: relative; padding: 12px 0 12px 34px; color: #334155; }
    li + li { border-top: 1px solid #F1F5F9; }
    /* Visto desenhado em CSS: a CSP não deixa carregar imagens. */
    li::before { content: ""; position: absolute; left: 0; top: 12px; width: 22px; height: 22px; border-radius: 50%; background: #EEF2FF; }
    li::after {
      content: ""; position: absolute; left: 8px; top: 17px; width: 5px; height: 9px;
      border: solid #6366F1; border-width: 0 2px 2px 0; transform: rotate(45deg);
    }
    p.nota { font-size: 12.5px; color: #64748B; }

    .botoes {
      display: flex; gap: 10px; justify-content: flex-end; align-items: center;
      padding: 16px 30px 18px; background: #FFFFFF; border-top: 1px solid #E2E8F0;
    }
    button {
      font: inherit; font-size: 14px; font-weight: 600; padding: 10px 20px; border-radius: 10px; cursor: pointer;
      border: 1px solid #CBD5E1; background: #FFFFFF; color: #334155; transition: background 0.15s, box-shadow 0.15s, transform 0.05s;
    }
    button:hover { background: #F1F5F9; }
    button:active { transform: translateY(1px); }
    button.principal {
      min-width: 120px; border-color: #6366F1; color: #FFFFFF;
      background: linear-gradient(180deg, #6D70F3 0%, #5B5EEA 100%); box-shadow: 0 6px 16px -4px rgba(99, 102, 241, 0.55);
    }
    button.principal:hover { background: linear-gradient(180deg, #5F62EE 0%, #4F46E5 100%); }
    button:focus-visible { outline: 3px solid #A5B4FC; outline-offset: 2px; }
  </style>
</head>
<body>
  <header class="topo">
    <div class="marca">
      <svg class="logo" viewBox="0 0 1180 1184" aria-hidden="true">
        <path transform="translate(189,20)" d="m0 0h796l25 2 22 5 20 7 25 13 14 10 10 8 15 14 11 14 9 13 9 16 7 16 7 22 3 16 2 24v775l-1 20-3 19-6 23-9 21-9 16-13 18-11 12-5 5-11 10-15 11-22 12-17 7-20 6-16 3-31 2h-774l-20-1-25-4-20-6-25-12-12-7-16-12-12-11-11-11-10-13-12-19-10-21-6-19-4-19-2-18v-796l3-23 6-23 11-26 11-18 10-13 9-10 7-8 8-7 13-10 16-10 23-11 22-7 22-4z" fill="#131320"/>
        <path transform="translate(279,159)" d="m0 0h180v173l180 1 24 2 28 4 21 5 21 6 17 6 23 10 24 12 21 13 32 24 12 11 8 7 12 12 7 8 10 12 9 13 12 19 9 15 13 26 11 30 6 23 5 27 2 23v44l-2 27-4 23-9 34-7 19-15 31-14 24-12 17-10 13-9 10-12 13-13 13-11 9-15 12-19 13-13 8-27 14-26 11-31 10-30 7-31 4-12 1h-47l-26-3-31-6-25-7-29-11-26-12-25-14-12-8-14-10-16-13-16-15-10-10-7-8-11-13-14-19-12-19-15-29-7-16-11-33-5-22-3-17-2-31v-174h178v-137l-1-38h-178l-1-67v-106z" fill="#E0E0E8"/>
        <path transform="translate(467,507)" d="m0 0h163l26 3 19 5 16 6 21 11 16 12 10 9 12 12 10 13 8 14 10 21 6 23 3 19 1 14-4 27-6 23-9 19-8 14-13 16-10 11-14 11-11 8-14 8-19 8-20 6-16 3-10 1h-22l-14-1-28-7-13-5-20-10-14-10-11-9-16-16-10-13-10-17-7-16-6-20-3-17-2-25v-150z" fill="#131320"/>
        <path transform="translate(279,159)" d="m0 0h180v45l-1 128-17 1h-162l-1-67v-106z" fill="#6366f1"/>
      </svg>
      <span class="etiqueta">Pedido de autorização</span>
    </div>
    <h1 id="titulo"></h1>
  </header>
  <main id="texto"></main>
  <div class="botoes">
    <button id="recusar" type="button"></button>
    <button id="aceitar" type="button" class="principal"></button>
  </div>
</body>
</html>
